# veracar.co nginx config (VPS)
# Redirects HTTP → HTTPS, proxies to Next.js (port 3001) and FastAPI scraper (:8765)

upstream nextjs {
    server 127.0.0.1:3001;
}

upstream scraper {
    server 127.0.0.1:8765;
}

server {
    listen 80;
    server_name veracar.co www.veracar.co;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Next.js app (main site)
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Scraper API endpoints
    location /api/scrape {
        proxy_pass http://scraper;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Health check (no logging)
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"veracar"}';
        add_header Content-Type application/json;
    }

    # Static files caching
    location ~* \.(ico|jpg|jpeg|png|gif|svg|css|js|woff|woff2|ttf|eot)$ {
        proxy_pass http://nextjs;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
